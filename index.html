
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6fa">
    <title>Мои расходы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header class="header">
            <div>
                <p class="subtitle">УПРАВЛЕНИЕ ФИНАНСАМИ</p>
                <h1>Мои расходы</h1>
            </div>
            <div class="header-icon">₸</div>
        </header>

        <section class="summary-card">
            <p>Всего потрачено</p>
            <h2 id="totalAmount">0 ₸</h2>
            <span id="expenseCount">0 расходов</span>
        </section>

        <section class="tabs-section">
            <div class="section-heading">
                <h2>Категории</h2>
                <button id="addTabBtn" class="add-tab-btn">+ Добавить</button>
            </div>
            <div id="tabsContainer" class="tabs"></div>
        </section>

        <section class="chart-section">
            <div class="section-heading">
                <h2>Статистика</h2>
            </div>
            <div class="chart-card">
                <div id="chart" class="chart">
                    <div class="chart-center">
                        <span>Расходы</span>
                        <strong id="chartTotal">0 ₸</strong>
                    </div>
                </div>
                <div id="chartLegend" class="chart-legend"></div>
            </div>
        </section>

        <section class="form-section">
            <div class="section-heading">
                <h2>Новый расход</h2>
            </div>

            <form id="expenseForm">
                <label for="expenseName">Название покупки</label>
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Например, хлеб"
                    required
                >

                <label for="expenseAmount">Сумма (₸)</label>
                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Например, 500"
                    min="1"
                    step="1"
                    required
                >

                <label for="expenseDate">Дата покупки</label>
                <input type="date" id="expenseDate" required>

                <button type="submit" class="save-btn">Сохранить расход</button>
            </form>
        </section>

        <section class="expenses-section">
            <div class="section-heading">
                <h2>Список расходов</h2>
            </div>
            <div id="expensesList" class="expenses-list"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
